kind = "web"
previewPath = "/panther/"
title = "The Panther Brand"
version = "1.0.0"
id = "artifacts/panther-brand"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/panther/" ]
localPort = 18785

[services.development]
run = "pnpm --filter @workspace/panther-brand run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/panther-brand", "run", "build" ]
publicDir = "artifacts/panther-brand/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18785"
BASE_PATH = "/panther/"
