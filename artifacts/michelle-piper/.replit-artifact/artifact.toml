kind = "web"
previewPath = "/"
title = "The Michelle Piper"
version = "1.0.0"
id = "artifacts/michelle-piper"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20280

[services.development]
run = "pnpm --filter @workspace/michelle-piper run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/michelle-piper", "run", "build" ]
publicDir = "artifacts/michelle-piper/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20280"
BASE_PATH = "/"
