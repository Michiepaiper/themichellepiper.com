openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: contact
  - name: enrollments
  - name: testimonials
  - name: admin
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /contact:
    post:
      operationId: createContactSubmission
      tags: [contact]
      summary: Submit contact form
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateContactSubmissionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionAck"

  /enrollments:
    post:
      operationId: createEnrollment
      tags: [enrollments]
      summary: Submit training enrollment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEnrollmentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionAck"

  /testimonials:
    get:
      operationId: listTestimonials
      tags: [testimonials]
      summary: List approved testimonials
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Testimonial"
    post:
      operationId: createTestimonial
      tags: [testimonials]
      summary: Submit a new testimonial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTestimonialInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Testimonial"

  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Verify admin password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLoginResult"
        "401":
          description: Invalid password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLoginResult"

  /admin/submissions:
    get:
      operationId: getAdminSubmissions
      tags: [admin]
      summary: List all submissions (requires X-Admin-Password header)
      parameters:
        - in: header
          name: X-Admin-Password
          required: true
          schema:
            type: string
      responses:
        "200":
          description: All submissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSubmissions"
        "401":
          description: Unauthorized

  /admin/testimonials/{id}:
    delete:
      operationId: adminDeleteTestimonial
      tags: [admin]
      summary: Delete a testimonial
      parameters:
        - in: header
          name: X-Admin-Password
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
        "404":
          description: Not found

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    SubmissionAck:
      type: object
      properties:
        id:
          type: integer
        ok:
          type: boolean
      required: [id, ok]

    CreateContactSubmissionInput:
      type: object
      properties:
        fullName:
          type: string
          minLength: 1
        email:
          type: string
          minLength: 1
        phone:
          type: string
          minLength: 1
        service:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
      required: [fullName, email, phone, service, message]

    CreateEnrollmentInput:
      type: object
      properties:
        fullName:
          type: string
          minLength: 1
        email:
          type: string
          minLength: 1
        phone:
          type: string
          minLength: 1
        course:
          type: string
          minLength: 1
      required: [fullName, email, phone, course]

    Testimonial:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        role:
          type: string
        text:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, name, role, text, createdAt]

    CreateTestimonialInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        role:
          type: string
          minLength: 1
        text:
          type: string
          minLength: 10
      required: [name, role, text]

    ContactSubmission:
      type: object
      properties:
        id:
          type: integer
        fullName:
          type: string
        email:
          type: string
        phone:
          type: string
        service:
          type: string
        message:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, fullName, email, phone, service, message, createdAt]

    EnrollmentSubmission:
      type: object
      properties:
        id:
          type: integer
        fullName:
          type: string
        email:
          type: string
        phone:
          type: string
        course:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, fullName, email, phone, course, createdAt]

    AdminTestimonial:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        role:
          type: string
        text:
          type: string
        approved:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required: [id, name, role, text, approved, createdAt]

    AdminSubmissions:
      type: object
      properties:
        contacts:
          type: array
          items:
            $ref: "#/components/schemas/ContactSubmission"
        enrollments:
          type: array
          items:
            $ref: "#/components/schemas/EnrollmentSubmission"
        testimonials:
          type: array
          items:
            $ref: "#/components/schemas/AdminTestimonial"
      required: [contacts, enrollments, testimonials]

    AdminLoginInput:
      type: object
      properties:
        password:
          type: string
      required: [password]

    AdminLoginResult:
      type: object
      properties:
        ok:
          type: boolean
      required: [ok]
